name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-memory
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-memory

      - name: Test
        # The runner's default TEMP is an 8.3 short path (RUNNER~1) while tools
        # echo the long form; pin it so the suite tests the code, not the alias
        # spelling (alias handling has unit coverage in src/path_spelling.rs).
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --tests --locked --no-fail-fast
